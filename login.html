<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - Bông Trà</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --main-green: #006030; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('/image/nen.jpg') center/cover no-repeat fixed;
      min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;
      padding-top: 60px;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 20px; padding: 40px; width: 100%; max-width: 440px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15); backdrop-filter: blur(5px);
    }
    .btn-auth { background-color: var(--main-green); color: white; font-weight: 700; border-radius: 10px; padding: 12px; border: none; width: 100%; transition: background 0.3s; }
    .btn-auth:hover { background-color: #004d25; }

    .error-feedback-text {
      color: #dc3545;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
      font-weight: 600;
      text-align: center;
    }

    .custom-welcome-toast {
      position: fixed; top: 85px; right: 25px; background: #ffffff; border-radius: 14px;
      padding: 18px 24px; box-shadow: 0 12px 35px rgba(0,0,0,0.18); display: flex;
      align-items: center; gap: 16px; z-index: 999999; transform: translateX(130%);
      transition: transform 0.45s cubic-bezier(0.68, -0.55, 0.265, 1.55); border: 1px solid #eaeaea;
    }
    .custom-welcome-toast.show { transform: translateX(0); }
    .toast-welcome-icon { width: 40px; height: 40px; background: #e8f5ed; color: var(--main-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .toast-text-title { font-size: 14.5px; font-weight: 700; color: #222222; margin-bottom: 2px; }
    .toast-text-sub { font-size: 12.5px; color: #666666; margin-bottom: 0; }
  </style>
</head>
<body>

  <!-- NẠP HEADER CHUNG TỰ ĐỘNG -->
  <div id="header-include"></div>

  <div class="custom-welcome-toast" id="welcomeToast">
    <div class="toast-welcome-icon"><i class="fa-solid fa-arrow-right-to-bracket"></i></div>
    <div>
      <div class="toast-text-title" id="toastNameTitle">Xin chào!</div>
      <p class="toast-text-sub">Đăng nhập thành công vào Bông Trà.</p>
    </div>
  </div>

  <div class="container py-5 d-flex justify-content-center align-items-center">
    <div class="auth-card">
      <div class="text-center mb-4">
        <h4 class="text-success fw-bold">ĐĂNG NHẬP TÀI KHOẢN</h4>
        <p class="text-muted small mb-0">Chào mừng bạn quay trở lại với Bông Trà</p>
      </div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label small fw-bold">Tài khoản</label>
          <input type="text" id="loginUser" class="form-control" placeholder="Nhập tên tài khoản" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Mật khẩu</label>
          <input type="password" id="loginPass" class="form-control" placeholder="Nhập mật khẩu" required>
        </div>
        
        <div class="error-feedback-text" id="loginErrorMsg">Sai tên đăng nhập hoặc mật khẩu, vui lòng kiểm tra lại!</div>

        <button type="submit" class="btn-auth mb-3">Đăng Nhập</button>
        <div class="text-center small">
          <span class="text-muted">Chưa có tài khoản?</span> <a href="/register" class="text-success fw-bold text-decoration-none">Đăng ký ngay</a>
        </div>
      </form>
    </div>
  </div>

  <div id="footer-include"></div>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    fetch('/header.html')
      .then(r => r.text())
      .then(html => { 
        document.getElementById('header-include').innerHTML = html;
        if (typeof initHeaderUser === 'function') {
          initHeaderUser();
        }
      });

    fetch('/footer.html')
      .then(r => r.text())
      .then(data => { document.getElementById('footer-include').innerHTML = data; });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      const errorMsg = document.getElementById('loginErrorMsg');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          errorMsg.style.display = 'none';
          localStorage.setItem('currentUser', username);

          // Đảm bảo user đăng nhập có giỏ hàng riêng, nếu chưa có thì tạo mới trống hoàn toàn
          if (!localStorage.getItem(`cartList_${username}`)) {
            localStorage.setItem(`cartList_${username}`, JSON.stringify([]));
          }

          if (typeof initHeaderUser === 'function') {
            initHeaderUser();
          }

          document.getElementById('toastNameTitle').innerText = `Chào mừng trở lại, ${username}!`;
          document.getElementById('welcomeToast').classList.add('show');

          setTimeout(() => {
            window.location.href = '/';
          }, 1500);
        } else {
          errorMsg.innerText = data.message || data.error || 'Sai tên đăng nhập hoặc mật khẩu, vui lòng kiểm tra lại!';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.innerText = 'Lỗi kết nối server!';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
